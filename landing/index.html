<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing de prueba — Campaña</title>
<style>
  :root {
    --azul: #1a4fd6;
    --azul-oscuro: #0f2f7a;
    --gris-texto: #2b2b33;
    --fondo: #f6f7fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--gris-texto);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(15, 47, 122, 0.12);
    padding: 40px;
    max-width: 440px;
    width: 100%;
  }
  h1 { font-size: 1.5rem; margin-bottom: 8px; }
  p.subtitulo { color: #666; margin-bottom: 28px; font-size: 0.95rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 16px 0 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #dcdfe6;
    border-radius: 10px;
    font-size: 1rem;
  }
  input:focus { outline: none; border-color: var(--azul); }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--azul);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--azul-oscuro); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #mensaje {
    margin-top: 18px;
    font-size: 0.9rem;
    text-align: center;
    display: none;
  }
  #mensaje.ok { color: #1a7a3a; display: block; }
  #mensaje.error { color: #b3261e; display: block; }
</style>
</head>
<body>

<div class="card">
  <h1>Quiero recibir la información</h1>
  <p class="subtitulo">Dejanos tus datos y te contactamos.</p>

  <form id="form-lead">
    <!--
      origen_campaña queda fijo acá, hardcodeado en la landing.
      Cada landing nueva (o cada relanzamiento con templates nuevos)
      cambia este único valor — ver docs/checklist-implementacion.md sección 10.
    -->
    <input type="hidden" name="origen_campaña" value="campaña_prueba_ago26">

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="apellido">Apellido</label>
    <input type="text" id="apellido" name="apellido" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="telefono">Teléfono (opcional)</label>
    <input type="tel" id="telefono" name="datos_extra">

    <button type="submit" id="btn-enviar">Enviar</button>
    <div id="mensaje"></div>
  </form>
</div>

<script>
  // Reemplazar por la URL del Web App una vez deployado en Apps Script
  // (Implementar > Nueva implementación > Aplicación web > Ejecutar como: yo,
  // Quién tiene acceso: cualquier usuario).
  const WEBAPP_URL = 'https://script.google.com/macros/s/TU_DEPLOY_ID/exec';

  const form = document.getElementById('form-lead');
  const boton = document.getElementById('btn-enviar');
  const mensaje = document.getElementById('mensaje');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    boton.disabled = true;
    boton.textContent = 'Enviando...';
    mensaje.style.display = 'none';

    const datos = new URLSearchParams(new FormData(form));

    try {
      // Se manda como URLSearchParams (application/x-www-form-urlencoded) a propósito:
      // es un "simple request" para el navegador, así que no dispara un preflight OPTIONS,
      // que Apps Script Web Apps no maneja. Con JSON + fetch normal, esto falla por CORS.
      const resp = await fetch(WEBAPP_URL, {
        method: 'POST',
        body: datos
      });
      const data = await resp.json();

      if (data.ok) {
        mensaje.textContent = data.duplicado
          ? 'Ya estabas registrado en esta campaña. ¡Gracias!'
          : '¡Listo! En breve nos contactamos.';
        mensaje.className = 'ok';
        form.reset();
      } else {
        throw new Error(data.error || 'Error desconocido');
      }
    } catch (err) {
      mensaje.textContent = 'Hubo un problema al enviar. Probá de nuevo en un momento.';
      mensaje.className = 'error';
      console.error(err);
    } finally {
      boton.disabled = false;
      boton.textContent = 'Enviar';
    }
  });
</script>

</body>
</html>
