<!--
  Template base — Diseño 1
  Este archivo va a GitHub tal cual, con este mismo nombre para siempre.
  El Script B lo descarga vía UrlFetchApp y reemplaza los placeholders:
    {{nombre}}          → nombre del lead
    {{apellido}}        → apellido del lead
    {{contenido}}       → texto/speech de ese paso puntual (viene de Config_Campañas)
    {{whatsapp_url}}    → link de tracking (pasa por el Tracker antes de ir a WhatsApp)
    {{asesora_nombre}}  → nombre de la asesora asignada a la campaña

  Para lanzar una campaña nueva NO se toca este archivo — solo se llena
  una fila en Config_Campañas. Este HTML solo se edita cuando cambia el
  diseño visual en sí (header, colores, estructura del botón).

  Tablas + estilos inline a propósito: es el estándar para que el email
  se vea igual en Gmail, Outlook y clientes móviles (no confiar en <style>
  en el <head> ni en flexbox/grid, la mayoría de los clientes de correo
  los ignora o los rompe).
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escencial Consultora</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f8; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f8; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#ffffff; border-radius:12px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background-color:#1a4fd6; padding:24px 32px;">
              <span style="color:#ffffff; font-size:18px; font-weight:bold;">Escencial Consultora</span>
            </td>
          </tr>

          <!-- Cuerpo -->
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 16px; font-size:16px; color:#2b2b33;">
                Hola {{nombre}} {{apellido}},
              </p>

              <div style="font-size:15px; line-height:1.6; color:#2b2b33;">
                {{contenido}}
              </div>

              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px 0;">
                <tr>
                  <td align="center" style="border-radius:8px; background-color:#25D366;">
                    <a href="{{whatsapp_url}}"
                       style="display:inline-block; padding:14px 28px; font-size:15px; font-weight:bold; color:#ffffff; text-decoration:none;">
                      Hablar por WhatsApp
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:0; font-size:13px; color:#777;">
                — {{asesora_nombre}}
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 32px; background-color:#f0f1f5;">
              <p style="margin:0; font-size:11px; color:#9a9a9a; text-align:center;">
                Escencial Consultora — Este email fue enviado porque dejaste tus datos en una de nuestras landings.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
