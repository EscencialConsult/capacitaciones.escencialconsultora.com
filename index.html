<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing — Campaña Prueba Ago26</title>
<style>
  :root {
    --morado-fondo-1: #2a1150;
    --morado-fondo-2: #1a0a33;
    --morado-card: #3d1a6b;
    --naranja: #ff8c1a;
    --naranja-oscuro: #e57312;
    --violeta-boton: #7b3fe4;
    --violeta-boton-hover: #6a2fd0;
    --texto-claro: #f5eefd;
    --texto-secundario: #cbb8ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(circle at 30% 20%, var(--morado-fondo-1), var(--morado-fondo-2));
    color: var(--texto-claro);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: var(--morado-card);
    border: 1px solid rgba(255, 140, 26, 0.25);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    padding: 40px;
    max-width: 440px;
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "🎃";
    position: absolute;
    top: -10px;
    right: -6px;
    font-size: 70px;
    opacity: 0.18;
    transform: rotate(12deg);
  }
  .badge {
    display: inline-block;
    background: var(--naranja);
    color: #2a1150;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.03em;
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 8px;
    line-height: 1.2;
  }
  h1 span { color: var(--naranja); }
  p.subtitulo {
    color: var(--texto-secundario);
    margin-bottom: 28px;
    font-size: 0.95rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin: 16px 0 6px;
    color: var(--texto-claro);
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    font-size: 1rem;
    background: rgba(255, 255, 255, 0.06);
    color: var(--texto-claro);
  }
  input::placeholder { color: rgba(245, 238, 253, 0.4); }
  input:focus {
    outline: none;
    border-color: var(--naranja);
    background: rgba(255, 255, 255, 0.1);
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--violeta-boton);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: var(--violeta-boton-hover); }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #mensaje {
    margin-top: 18px;
    font-size: 0.9rem;
    text-align: center;
    display: none;
  }
  #mensaje.ok { color: #6ee7a0; display: block; }
  #mensaje.error { color: #ff8a8a; display: block; }
</style>
</head>
<body>

<div class="card">
  <span class="badge">🕸️ Oferta por tiempo limitado</span>
  <h1>Truco o <span>Descuento</span></h1>
  <p class="subtitulo">Dejanos tus datos y te contactamos con tu descuento exclusivo.</p>

  <form id="form-lead">
    <!--
      origen_campaña queda fijo acá, hardcodeado en la landing.
      Tiene que matchear EXACTO con una fila de Config_Campañas.
    -->
    <input type="hidden" name="origen_campaña" value="campaña_prueba_ago26">

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

    <label for="apellido">Apellido</label>
    <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="tu@email.com" required>

    <label for="telefono">Teléfono (opcional)</label>
    <input type="tel" id="telefono" name="datos_extra" placeholder="Opcional">

    <button type="submit" id="btn-enviar">Enviar</button>
    <div id="mensaje"></div>
  </form>
</div>

<script>
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyg3QGXHpaNy3ecaalf_yq41xLohPFycZqmQl5VXyLtkPHxtJotoFKd_vkSzd6zWJbo1A/exec';

  const form = document.getElementById('form-lead');
  const boton = document.getElementById('btn-enviar');
  const mensaje = document.getElementById('mensaje');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    boton.disabled = true;
    boton.textContent = 'Enviando...';
    mensaje.style.display = 'none';

    const datos = new URLSearchParams(new FormData(form));

    try {
      const resp = await fetch(WEBAPP_URL, {
        method: 'POST',
        body: datos
      });
      const data = await resp.json();

      if (data.ok) {
        mensaje.textContent = data.duplicado
          ? 'Ya estabas registrado en esta campaña. ¡Gracias!'
          : '¡Listo! En breve nos contactamos.';
        mensaje.className = 'ok';
        form.reset();
      } else {
        throw new Error(data.error || 'Error desconocido');
      }
    } catch (err) {
      mensaje.textContent = 'Hubo un problema al enviar. Probá de nuevo en un momento.';
      mensaje.className = 'error';
      console.error(err);
    } finally {
      boton.disabled = false;
      boton.textContent = 'Enviar';
    }
  });
</script>

</body>
</html>
