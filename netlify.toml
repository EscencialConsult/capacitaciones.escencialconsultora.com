[build]
  command = "next build"

[functions]
  directory = "netlify/functions"

# Sin "publish" a propósito: el Next Runtime de Netlify (detectado solo
# por el framework) maneja el ruteo de SSR/Route Handlers/Middleware por
# su cuenta. Forzar publish = ".next" hace que Netlify sirva esa carpeta
# como si fuera contenido estático plano en vez de dejar que el Next
# Runtime la interprete — eso rompía TODAS las rutas (404 hasta en "/").

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
